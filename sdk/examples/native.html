<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDK 内置呼吸试验</title>
<h1>内置呼吸试验</h1><p>已分析命令布局，视觉仍待样机确认。内置呼吸周期固定，按键呼吸走另一内部算法。</p>
<button id="connect">连接自己的棒子</button><button id="breathe" disabled>红色呼吸</button><button id="pink" disabled>呼吸改为粉红</button><button id="off" disabled>退出并熄灯</button><button id="disconnect">断开</button><p id="status" role="status">未连接</p>
<script type="module">
import { LightstickClient } from '../index.mjs';
const status=document.querySelector('#status');let busy=false,native=false;
const ids=['breathe','pink','off'];
function controls() { ids.forEach(id=>document.getElementById(id).disabled=!client.ready || busy || (id==='pink'&&!native)); }
const client=new LightstickClient({onState(state){status.textContent=state;if(state!=='ready')native=false;controls();}});
const run=async task=>{if(busy)return;busy=true;controls();try{await task();}catch(e){status.textContent=e.message;}finally{busy=false;controls();}};
document.querySelector('#connect').onclick=()=>run(()=>client.connect());
document.querySelector('#breathe').onclick=()=>run(async()=>{native=await client.setNativeEffect('breathe',{rgb:[255,0,0]});status.textContent=native?'内置呼吸指令已确认':'指令被覆盖';});
document.querySelector('#pink').onclick=()=>run(()=>client.setColor([255,32,32]));
document.querySelector('#off').onclick=()=>run(async()=>{if(await client.stopNativeEffect()){native=false;status.textContent='停止指令已确认';}});
document.querySelector('#disconnect').onclick=()=>client.disconnect();
</script></html>
