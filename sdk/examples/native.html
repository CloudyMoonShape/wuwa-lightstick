<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDK native effect example</title>
<h1>Native effects</h1><p>Native breathing has user feedback from the research sample. The palette cycle still needs a device test. Native breathing has a fixed period. The physical button uses a different internal algorithm.</p>
<button id="connect">Connect your lightstick</button><button id="breathe" disabled>Red breathing</button><button id="pink" disabled>Change to pink</button><button id="cycle" disabled>15-color cycle</button><button id="off" disabled>退出并Off</button><button id="disconnect">Disconnect</button><p id="status" role="status">Disconnected</p>
<script type="module">
import { LightstickClient } from '../index.mjs';
const status=document.querySelector('#status');let busy=false,native=false;
const ids=['breathe','pink','cycle','off'];
function controls() { ids.forEach(id=>document.getElementById(id).disabled=!client.ready || busy || (id==='pink'&&!native)); }
const client=new LightstickClient({onState(state){status.textContent=state;if(state!=='ready')native=false;controls();}});
const run=async task=>{if(busy)return;busy=true;controls();try{await task();}catch(e){status.textContent=e.message;}finally{busy=false;controls();}};
document.querySelector('#connect').onclick=()=>run(()=>client.connect());
document.querySelector('#breathe').onclick=()=>run(async()=>{native=await client.setNativeEffect('breathe',{rgb:[255,0,0]});status.textContent=native?'Breathing command acknowledged':'Command replaced';});
document.querySelector('#pink').onclick=()=>run(()=>client.setColor([255,32,32]));
document.querySelector('#cycle').onclick=()=>run(async()=>{if(await client.setNativeEffect('palette-cycle')){native=false;status.textContent='Cycle command acknowledged';}});
document.querySelector('#off').onclick=()=>run(async()=>{if(await client.stopNativeEffect()){native=false;status.textContent='Stop command acknowledged';}});
document.querySelector('#disconnect').onclick=()=>client.disconnect();
</script></html>
