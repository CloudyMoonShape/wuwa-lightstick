<!doctype html><html lang="en"><meta charset="utf-8"><title>SDK color example</title>
<button id="connect">Connect your lightstick</button><button id="red" disabled>Red</button><button id="off" disabled>Off</button><button id="disconnect">Disconnect</button><p id="status">Disconnected</p>
<script type="module">
import { LightstickClient } from '../index.mjs';
const status = document.querySelector('#status');
const client = new LightstickClient({onState(state) {
  status.textContent = state;
  document.querySelector('#red').disabled = state !== 'ready';
  document.querySelector('#off').disabled = state !== 'ready';
}});
const run = async task => { try { await task(); } catch(e) { status.textContent = e.message; } };
document.querySelector('#connect').onclick = () => run(() => client.connect());
document.querySelector('#red').onclick = () => run(() => client.setColor([255,0,0]));
document.querySelector('#off').onclick = () => run(() => client.setColor([0,0,0]));
document.querySelector('#disconnect').onclick = () => client.disconnect();
</script></html>
